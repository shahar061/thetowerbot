[project]
name = "thetowerbot"
version = "0.1.0"
description = "Background ADB bot for the Android game The Tower"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Background Android automation over ADB (no mouse/focus stealing).
    "adbutils>=2.12",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "rich>=15.0.0",
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "uvicorn>=0.52.4",
    # Reads upgrade names and prices off the screen. Pinned: RapidOCR's
    # output can shift between versions, and the confidence floor in
    # config.py is calibrated against this one.
    "rapidocr-onnxruntime==1.4.4",
    "websockets>=15",
]

[tool.uv]
# Scripts live at the repo root; nothing here is installed as a package.
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
